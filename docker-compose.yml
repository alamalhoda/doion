# Optional local Docker.
#
# Daily: docker compose up -d
#        DATABASE_URL=postgres://doion@localhost:5432/doion
#        Django on the host with uv (see docs/development/LOCAL_DEV_AND_PRODUCT_RUNTIME.md)
# SQLite: do not start this file.
# Product-image smoke: docker compose --profile app up -d --build
# On macOS + Docker Desktop, use localhost (not 127.0.0.1) for host clients.
#
# Auth is trust on localhost so this file has no password (GitGuardian).
# If host port 5432 is busy, change the left-hand port only (e.g. "5433:5432").

name: doion-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: doion
      POSTGRES_DB: doion
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - doion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doion -d doion"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: [app]
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    profiles: [app]
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://doion@postgres:5432/doion
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: local-docker-not-for-production
      DJANGO_ADMIN_URL: admin/
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GUNICORN_WORKERS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  doion_pgdata:
