name: CI E2E Playwright

# Not a merge gate: do not add this workflow to required checks on develop.
# After a successful dispatched E2E, job bump-pin opens a feature PR to develop.
# The pin lives in e2e/ui-pin (not this YAML): GITHUB_TOKEN cannot push workflow edits.
# Never push the pin directly to develop or main.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ui_sha:
        description: Full or short commit SHA from alamalhoda/checkyar-googleai (empty = YAML pin)
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [frontend-e2e]

jobs:
  e2e:
    name: smoke + critical
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      ui_full_sha: ${{ steps.pin_sha.outputs.full_sha }}
      should_bump: ${{ steps.pin_sha.outputs.should_bump }}

    steps:
      - name: Checkout doion
        uses: actions/checkout@v4

      - name: Resolve UI SHA
        id: ui_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.inputs.ui_sha }}
          PAYLOAD_SHA: ${{ github.event.client_payload.ui_sha }}
        run: |
          set -euo pipefail
          PINNED="$(tr -d '[:space:]' < e2e/ui-pin)"
          if ! printf '%s' "$PINNED" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "e2e/ui-pin must be a 40-character hex SHA"
            exit 1
          fi
          echo "PINNED_UI_SHA=$PINNED" >> "$GITHUB_ENV"
          SHA=""
          case "$EVENT_NAME" in
            workflow_dispatch) SHA="${DISPATCH_SHA:-}" ;;
            repository_dispatch) SHA="${PAYLOAD_SHA:-}" ;;
          esac
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ -z "$SHA" ]; then
            echo "repository_dispatch type frontend-e2e requires client_payload.ui_sha"
            exit 1
          fi
          if [ -z "$SHA" ]; then
            SHA="$PINNED"
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            echo "Invalid ui_sha (expected 7-40 hex chars)"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Using UI SHA $SHA (event=$EVENT_NAME pin=$PINNED)"

      # Pin by default so PR/push cannot follow a floating UI branch. Dispatch
      # may override with a reviewed SHA (see E2E_LOCAL_RUNBOOK.md).
      - name: Checkout active UI
        uses: actions/checkout@v4
        with:
          repository: alamalhoda/checkyar-googleai
          ref: ${{ steps.ui_ref.outputs.sha }}
          path: checkyar-googleai
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record resolved UI SHA
        id: pin_sha
        run: |
          set -euo pipefail
          FULL="$(git -C checkyar-googleai rev-parse HEAD)"
          echo "full_sha=$FULL" >> "$GITHUB_OUTPUT"
          if [ "$FULL" = "$PINNED_UI_SHA" ]; then
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_bump=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved UI $FULL pin=$PINNED_UI_SHA bump=$( [ "$FULL" = "$PINNED_UI_SHA" ] && echo false || echo true )"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          prune-cache: false
          python-version: "3.12"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node (Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Prepare demo backend
        working-directory: backend
        env:
          DJANGO_DEMO_DATABASE: "1"
          DEMO_SEED_PASSWORD: password123
        run: |
          source .venv/bin/activate 2>/dev/null || true
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_demo --password "$DEMO_SEED_PASSWORD" --reset

      - name: Start backend
        working-directory: backend
        env:
          DJANGO_DEMO_DATABASE: "1"
          DJANGO_SETTINGS_MODULE: config.settings.local
        run: |
          nohup uv run python manage.py runserver 127.0.0.1:8000 > /tmp/doion-backend.log 2>&1 &
          # /api/v1/ requires auth (401) — that still proves the server is up.
          # curl -f would treat 401 as failure and never pass readiness.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/v1/ || true)
            case "$code" in
              200|401|403) exit 0 ;;
            esac
            sleep 2
          done
          echo "backend failed to start"; cat /tmp/doion-backend.log; exit 1

      - name: Install and start UI
        working-directory: checkyar-googleai
        run: |
          printf 'VITE_USE_MOCK=false\nVITE_API_BASE_URL=http://127.0.0.1:8000/api/v1\n' > .env
          bun install
          nohup bun run dev -- --host 127.0.0.1 --port 3000 > /tmp/ui-dev.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 2
          done
          echo "UI failed to start"; cat /tmp/ui-dev.log; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run smoke
        working-directory: e2e
        env:
          FRONTEND_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:8000/api/v1
          DEMO_SEED_PASSWORD: password123
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:smoke

      - name: Run critical
        working-directory: e2e
        env:
          FRONTEND_URL: http://127.0.0.1:3000
          API_URL: http://127.0.0.1:8000/api/v1
          DEMO_SEED_PASSWORD: password123
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:critical

      - name: Stop background servers
        if: always()
        run: |
          pkill -f "manage.py runserver" || true
          pkill -f "bun run dev" || true

  bump-pin:
    name: open pin PR
    needs: e2e
    if: >-
      success() &&
      needs.e2e.outputs.should_bump == 'true' &&
      (
        github.event_name == 'repository_dispatch' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.ui_sha != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Open GitFlow PR for PINNED_UI_SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_SHA: ${{ needs.e2e.outputs.ui_full_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$NEW_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "Invalid ui_full_sha"
            exit 1
          fi
          SHORT="$(printf '%s' "$NEW_SHA" | cut -c1-12)"
          BRANCH="feature/e2e-ui-pin-${SHORT}"
          if [ "$(gh pr list --repo "${GITHUB_REPOSITORY}" --base develop --head "${GITHUB_REPOSITORY_OWNER}:${BRANCH}" --json number --jq 'length')" != "0" ]; then
            echo "PR already open for ${BRANCH}"
            exit 0
          fi
          git checkout -b "$BRANCH"
          printf '%s\n' "$NEW_SHA" > e2e/ui-pin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/ui-pin
          git diff --cached --quiet && { echo "pin already current on develop"; exit 0; }
          git commit -m "chore(e2e): pin UI checkout to ${SHORT}"
          git push -u origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "chore(e2e): pin UI checkout to ${SHORT}" \
            --body "$(printf '%s\n' \
              "After successful Playwright E2E against \`${NEW_SHA}\`." \
              "" \
              "Updates \`e2e/ui-pin\` so PR/push E2E on \`develop\` uses that UI commit." \
              "Does not merge itself. Not a required check." \
              "")"
